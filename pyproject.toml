[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svt-core"
version = "0.1.0"
description = "Shared primitives for the SVT ecosystem (Stats, Logger, SSHClient, config)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paramiko>=3.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
]

[tool.setuptools.packages.find]
include = ["svt_core", "svt_core.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
